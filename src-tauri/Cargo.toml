[package]
name = "wolf-timeline"
version = "1.1.1"
description = "Local-first, encrypted sovereign dev notes & timeline tool"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "dialog-save", "shell-open", "notification-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
dirs = "5"
argon2 = "0.5"
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
